---
name: Test shacl2code
on:
  push:
    # Skip changes in docs and other workflows
    paths: &trigger-paths
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/workflows/**"
      - ".github/workflows/test.yaml"
  pull_request:
    paths: *trigger-paths
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Needed by the coverage-comment step below
      pull-requests: write # Needed by the coverage-comment step below
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          npm install -g jsonld-cli
          npm --prefix scripts ci
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cppcheck doxygen graphviz ccache
      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cppcheck doxygen gcc go graphviz ccache
      - name: Install Go static analysis tools
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Install Rust static analysis tools
        run: |
          rustup component add clippy
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
      - name: Build package
        run: |
          python -m build
      - name: Install package
        run: |
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest -v
      - name: Coverage comment
        id: coverage_comment
        if: >-
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: py-cov-action/python-coverage-comment-action@2b84cfb222691291ba358a586c13606f0a9c172c # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Black in this Python version must support all target-versions listed in pyproject.toml
          python-version: "3.14"
          cache: pip
      - uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e # 26.5.1
      - uses: py-actions/flake8@84ec6726560b6d5bd68f2a5bed83d62b52bb50ba # v2.3.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install clang-format
      - name: Check code formatting
        run: |
          ./scripts/format.sh
          git diff --exit-code
